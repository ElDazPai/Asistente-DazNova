[package]
name = "asistente-daznova"
version = "0.1.0"
description = "Asistente personal inteligente de escritorio"
authors = ["Daz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "asistente_daznova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Perfil de release orientado a tamaño y arranque rápido.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
